<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Work | VT Land Services</title>
  <meta name="description" content="Photos of land clearing, grading, tree work and landscaping projects completed by VT Land Services in the NC foothills.">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="icon" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="work">

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Project Gallery</span>
      <h1>Our Work</h1>
      <p>A look at recent jobs across Lincoln, Burke, Catawba and Caldwell Counties. Tap any photo to view it full size.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <!-- Job video: plays muted on a loop. To swap it, replace images/video/hydroseeding.mp4 (+ the poster .jpg) -->
      <figure class="work-video reveal">
        <video autoplay muted loop playsinline preload="metadata" poster="images/video/hydroseeding-poster.jpg"
               aria-label="Hydroseeding a freshly graded slope">
          <source src="images/video/hydroseeding.mp4" type="video/mp4">
        </video>
        <figcaption>Hydroseeding a freshly graded slope</figcaption>
      </figure>
      <div class="gallery"></div>
    </div>
  </section>

  <!-- BEFORE/AFTER slider: add back once he has a before + after photo of the same job (see README) -->

  <section class="cta-band">
    <div class="container">
      <h2>Want Results Like These?</h2>
      <p>Free estimates across the NC foothills.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" data-phone data-keep="1"><span data-icon="phone"></span> Call Now</a>
        <a class="btn btn-ghost" href="contact.html#quote">Request a Quote</a>
      </div>
    </div>
  </section>

  <script src="js/site-config.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
